name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Version browser assets
        env:
          SITE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          revision = os.environ['SITE_REVISION']
          for asset in ('./style.css', './script.js', './profile.js', './favicon.svg'):
              html = html.replace('"' + asset + '"', '"' + asset + '?v=' + revision + '"')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
